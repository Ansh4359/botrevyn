<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen font-sans text-gray-900">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="font-bold text-xl text-indigo-600">🤖 AI Reviewer</span>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user %}
                    <img class="h-8 w-8 rounded-full" src="{{ user.avatar_url }}" alt="">
                    <span class="text-sm font-medium text-gray-700">{{ user.username }}</span>
                    <a href="/auth/logout" class="text-sm text-gray-500 hover:text-gray-700">Logout</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
